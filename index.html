<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>晨露小鎮：HD-2D 原型</title>
    <link rel="stylesheet" href="css/all.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>晨露小鎮：HD-2D 農場原型</h1>
        <p>
          方向鍵移動、<kbd>Shift + 方向鍵</kbd> 跑步、<kbd>Space</kbd> 耕地、<kbd>F</kbd> 澆水。
          角色已改為 SVG Sprite Sheet（避免二進位檔） 動畫（待機 / 走路 / 跑步 / 澆水）。
        </p>
      </header>

      <section class="game-shell" aria-label="HD-2D 遊戲畫面">
        <canvas id="game" width="960" height="540"></canvas>
      </section>

      <section class="hud" aria-live="polite">
        <div><span>Day</span><strong id="day">1</strong></div>
        <div><span>Energy</span><strong id="energy">100</strong></div>
        <div><span>Coins</span><strong id="coins">120</strong></div>
        <div><span>Harvest</span><strong id="harvest">0</strong></div>
      </section>
    </main>

    <script src="js/all.js"></script>
  </body>
</html>
